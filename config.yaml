server:
  host: 0.0.0.0
  port: 18789           # NOTE: same default as OpenClaw. If running both on the same
                        # machine, change this and update identity_dir in P-Ork's config.yaml

agents_dir: ./agents    # directory containing agent subdirectories

identity:
  path: ~/.pork-gateway/identity   # auto-generated on first run if absent

# Runtime limits — tune these for your environment
limits:
  max_agent_iterations: 20         # max LLM ↔ tool call loops per agent run
  request_timeout_seconds: 180     # how long to wait for a single LLM API response
  mcp_tool_timeout_seconds: 30     # per-tool-call timeout against MCP servers

mcp_servers:
  filesystem:
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "/private/tmp"]
  grafana:
    command: npx
    args: ["-y", "@grafana/mcp-grafana"]
    env:
      GRAFANA_URL: ${GRAFANA_URL}
      GRAFANA_TOKEN: ${GRAFANA_TOKEN}
  tavily:
    command: npx
    args: ["-y", "tavily-mcp"]
    env:
      TAVILY_API_KEY: ${TAVILY_API_KEY}

providers:
  anthropic:
    api_key: ${ANTHROPIC_API_KEY}
  openrouter:
    api_key: ${OPENROUTER_API_KEY}
    base_url: https://openrouter.ai/api/v1

logging:
  level: INFO